services:
  postgres:
    image: postgres:16
    container_name: PathoCollab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixtral_user
      POSTGRES_PASSWORD: pixtral_pass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-multiple-databases.sql:/docker-entrypoint-initdb.d/01-init-multiple-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixtral_user -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixtral-network

  redis:
    image: redis:7-alpine
    container_name: PathoCollab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - pixtral-network

  minio:
    image: minio/minio:latest
    container_name: PathoCollab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - pixtral-network

  minio-init:
    image: minio/mc:latest
    container_name: PathoCollab-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/pixtral-images;
      mc mb --ignore-existing local/pixtral-wsi-images;
      exit 0;
      "
    networks:
      - pixtral-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: PathoCollab-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - pixtral-network

  auth-service:
    build:
      context: ../apps/auth-service
      dockerfile: Dockerfile
    container_name: PathoCollab-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://pixtral_user:pixtral_pass@postgres:5432/auth_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://pixtral_user:pixtral_pass@postgres:5432/auth_db
      JWT_SECRET_KEY: super-secret-key
    depends_on:
      - postgres
    ports:
      - "8001:8001"
    networks:
      - pixtral-network

  cases-service:
    build:
      context: ../apps/cases-service
      dockerfile: Dockerfile
    container_name: PathoCollab-cases-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: "8002"
      DATABASE_URL: postgresql+asyncpg://pixtral_user:pixtral_pass@postgres:5432/cases_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://pixtral_user:pixtral_pass@postgres:5432/cases_db
    depends_on:
      - postgres
    ports:
      - "8002:8002"
    networks:
      - pixtral-network

  workflow-service:
    build:
      context: ../apps/workflow-service
      dockerfile: Dockerfile
    container_name: PathoCollab-workflow-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: "8003"
      DATABASE_URL: postgresql+asyncpg://pixtral_user:pixtral_pass@postgres:5432/workflow_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://pixtral_user:pixtral_pass@postgres:5432/workflow_db
    depends_on:
      - postgres
    ports:
      - "8003:8003"
    networks:
      - pixtral-network

  images-service:
    build:
      context: ../apps/images-service
      dockerfile: Dockerfile
    container_name: PathoCollab-images-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: "8004"
      DATABASE_URL: postgresql+asyncpg://pixtral_user:pixtral_pass@postgres:5432/images_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://pixtral_user:pixtral_pass@postgres:5432/images_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_IMAGES: PathoCollab-images
      MINIO_BUCKET_WSI: PathoCollab-wsi-images
    depends_on:
      - postgres
      - minio
    ports:
      - "8004:8004"
    networks:
      - pixtral-network

  reports-service:
    build:
      context: ../apps/reports-service
      dockerfile: Dockerfile
    container_name: PathoCollab-reports-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: "8005"
      DATABASE_URL: postgresql+asyncpg://pixtral_user:pixtral_pass@postgres:5432/reports_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://pixtral_user:pixtral_pass@postgres:5432/reports_db
      QDRANT_URL: http://qdrant:6333
      WAIT_FOR_QDRANT: "true"
    depends_on:
      - postgres
      - qdrant
    ports:
      - "8005:8005"
    networks:
      - pixtral-network

  backend-gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: PathoCollab-backend-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - cases-service
      - workflow-service
      - images-service
      - reports-service
    ports:
      - "8000:8000"
    networks:
      - pixtral-network

volumes:
  postgres-data:
  redis-data:
  minio-data:
  qdrant-data:

networks:
  pixtral-network:
    driver: bridge