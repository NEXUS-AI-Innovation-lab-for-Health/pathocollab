services:
  postgres:
    image: postgres:16
    container_name: PathoCollab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixtral_user
      POSTGRES_PASSWORD: pixtral_pass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-multiple-databases.sql:/docker-entrypoint-initdb.d/01-init-multiple-databases.sql
    networks:
      - pixtral-network

  redis:
    image: redis:7-alpine
    container_name: PathoCollab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - pixtral-network

  minio:
    image: minio/minio:latest
    container_name: PathoCollab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - pixtral-network

  minio-init:
    image: minio/mc:latest
    container_name: PathoCollab-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/pixtral-images;
      mc mb --ignore-existing local/pixtral-wsi-images;
      exit 0;
      "
    networks:
      - pixtral-network

  orthanc:
    image: jodogne/orthanc
    container_name: orthanc
    ports:
      - "8042:8042"
      - "4242:4242"
    environment:
      ORTHANC__NAME: "Orthanc"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: |
        { "orthanc": "orthanc" }
    restart: unless-stopped
    networks:
      - pixtral-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: PathoCollab-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - pixtral-network

  auth-service:
    image: ultimatedpv4/pathocollab-auth-service:latest
    container_name: PathoCollab-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://pixtral_user:pixtral_pass@postgres:5432/auth_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://pixtral_user:pixtral_pass@postgres:5432/auth_db
      JWT_SECRET_KEY: super-secret-key
    depends_on:
      - postgres
    ports:
      - "8001:8001"
    networks:
      - pixtral-network

  cases-service:
    image: ultimatedpv4/pathocollab-cases-service:latest
    container_name: PathoCollab-cases-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: "8002"
      DATABASE_URL: postgresql+asyncpg://pixtral_user:pixtral_pass@postgres:5432/cases_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://pixtral_user:pixtral_pass@postgres:5432/cases_db
    depends_on:
      - postgres
    ports:
      - "8002:8002"
    networks:
      - pixtral-network

  workflow-service:
    image: ultimatedpv4/pathocollab-workflow-service:latest
    container_name: PathoCollab-workflow-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: "8003"
      DATABASE_URL: postgresql+asyncpg://pixtral_user:pixtral_pass@postgres:5432/workflow_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://pixtral_user:pixtral_pass@postgres:5432/workflow_db
    depends_on:
      - postgres
    ports:
      - "8003:8003"
    networks:
      - pixtral-network

  images-service:
    image: ultimatedpv4/pathocollab-images-service:latest
    container_name: PathoCollab-images-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: "8004"
      DATABASE_URL: postgresql+asyncpg://pixtral_user:pixtral_pass@postgres:5432/images_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://pixtral_user:pixtral_pass@postgres:5432/images_db

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: pixtral-wsi-images
      MINIO_BUCKET_IMAGES: pixtral-images
      MINIO_BUCKET_WSI: pixtral-wsi-images

      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: orthanc
      ORTHANC_PASSWORD: orthanc
      ORTHANC_ENABLED: "true"

      INSTANTSEG_ENABLED: "true"
      INSTANTSEG_URL: http://instanseg-service:8010
    depends_on:
      - postgres
      - minio
      - orthanc
    ports:
      - "8004:8004"
    networks:
      - pixtral-network

  reports-service:
    image: ultimatedpv4/pathocollab-reports-service:latest
    container_name: PathoCollab-reports-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: "8005"
      DATABASE_URL: postgresql+asyncpg://pixtral_user:pixtral_pass@postgres:5432/reports_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://pixtral_user:pixtral_pass@postgres:5432/reports_db
      QDRANT_ENABLED: "true"
      QDRANT_URL: http://qdrant:6333
      WAIT_FOR_QDRANT: "false"
    depends_on:
      - postgres
    ports:
      - "8005:8005"
    networks:
      - pixtral-network

  instanseg-service:
    image: ultimatedpv4/pathocollab-instanseg-service:latest
    container_name: PathoCollab-instanseg-service
    ports:
      - "8010:8010"
    restart: unless-stopped
    environment:
      IMAGES_INTERNAL_HOST: images-service
      IMAGES_INTERNAL_PORT: "8004"
    depends_on:
      - images-service
    networks:
      - pixtral-network

  backend-gateway:
    image: ultimatedpv4/pathocollab-backend-gateway:latest
    container_name: PathoCollab-backend-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - cases-service
      - workflow-service
      - images-service
      - reports-service
    ports:
      - "8000:8000"
    networks:
      - pixtral-network

  olga-mysql:
    image: mysql:8.0
    container_name: PathoCollab-olga-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: olga
      MYSQL_USER: olga_user
      MYSQL_PASSWORD: olga_password
    ports:
      - "3306:3306"
    volumes:
      - olga-mysql-data:/var/lib/mysql
    networks:
      - pixtral-network

  olga-api:
    image: kirito140/olga-backend:latest
    container_name: PathoCollab-olga-api
    restart: unless-stopped
    environment:
      ADDRESS: 0.0.0.0
      PORT: 9091
      MYSQL_URL: jdbc:mysql://olga-mysql:3306/olga
      MYSQL_USERNAME: olga_user
      MYSQL_PASSWORD: olga_password
      FIREBASE_KEY_PATH: /app/config/apiKey.json
    depends_on:
      - olga-mysql
    ports:
      - "9091:9091"
    volumes:
      - ../apps/olga-service/config/apiKey.json:/app/config/apiKey.json:ro
    networks:
      - pixtral-network

  olga-designer:
    image: ultimatedpv4/pathocollab-olga-designer:latest
    container_name: PathoCollab-olga-designer
    restart: unless-stopped
    depends_on:
      - olga-api
    ports:
      - "8080:80"
    volumes:
      - ../apps/olga-service/config/config.json:/usr/share/nginx/html/config/config.json:ro
    networks:
      - pixtral-network

  olga-admin:
    image: ultimatedpv4/pathocollab-olga-admin:latest
    container_name: PathoCollab-olga-admin
    restart: unless-stopped
    depends_on:
      - olga-api
    ports:
      - "8081:80"
    volumes:
      - ../apps/olga-service/config/config.json:/usr/share/nginx/html/config/config.json:ro
    networks:
      - pixtral-network

volumes:
  postgres-data:
  redis-data:
  minio-data:
  qdrant-data:
  olga-mysql-data:

networks:
  pixtral-network:
    driver: bridge