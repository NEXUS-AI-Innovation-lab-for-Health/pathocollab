name: Build and push Docker images

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: ./apps/auth-service
          - name: cases-service
            context: ./apps/cases-service
          - name: images-service
            context: ./apps/images-service
          - name: instanseg-service
            context: ./apps/instanseg-service
          - name: reports-service
            context: ./apps/reports-service
          - name: workflow-service
            context: ./apps/workflow-service
          - name: olga-admin
            context: ./apps/olga-service
            dockerfile: Dockerfile.admin
          - name: olga-designer
            context: ./apps/olga-service
            dockerfile: Dockerfile.designer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile || 'Dockerfile' }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pathocollab-${{ matrix.name }}:latest